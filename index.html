<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>COBB CAN MOVE — fan reimplementation</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Oswald:wght@500&display=swap" rel="stylesheet" />
<style>
  :root {
    --void:   #0d0b0e;
    --room:   #1c181d;
    --stone:  #2e2830;
    --lip:    #3d3540;
    --bone:   #ded6d0;
    --dim:    #7a6f78;
    --switch: #6fd0c8;
    --ember:  #d4703a;
    --blood:  #8e2b34;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%;
    background: var(--void); color: var(--bone);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
  }
  body { display: grid; place-items: center; gap: 12px; padding: 16px; }
  header { width: min(768px, 100%); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  h1 {
    font-family: "Oswald", system-ui, sans-serif; font-weight: 500;
    font-size: clamp(18px, 4.5vw, 26px); letter-spacing: 0.06em; margin: 0;
  }
  #rules { font-size: 12px; color: var(--dim); letter-spacing: 0.08em; text-align: right; }
  #rules b { color: var(--blood); font-weight: 600; }
  #stage { position: relative; width: min(768px, 100%); aspect-ratio: 768 / 512; }
  canvas {
    width: 100%; height: 100%; display: block; background: var(--void);
    border-radius: 2px; box-shadow: 0 0 0 1px var(--stone), 0 24px 60px -30px #000;
  }
  #card {
    position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 14px;
    background: var(--void); border-radius: 2px; transition: opacity 300ms ease;
  }
  #card.gone { opacity: 0; pointer-events: none; }
  #card h2 {
    font-family: "Oswald", sans-serif; font-weight: 500; margin: 0;
    font-size: clamp(26px, 7vw, 52px); letter-spacing: 0.1em;
  }
  #card h2 span { color: var(--blood); }
  #card p { margin: 0; color: var(--dim); font-size: 13px; letter-spacing: 0.05em; }
  #card kbd {
    border: 1px solid var(--lip); border-radius: 3px; padding: 1px 6px; color: var(--bone); font: inherit; font-size: 12px;
  }
  footer { width: min(768px, 100%); color: var(--dim); font-size: 12px; line-height: 1.7; }
  footer b { color: var(--bone); font-weight: 400; }
</style>
</head>
<body>

<header>
  <h1>COBB CAN MOVE</h1>
  <p id="rules"></p>
</header>

<div id="stage">
  <canvas id="game" width="768" height="512" aria-label="어두운 방을 탑다운으로 내려다보는 게임 화면"></canvas>
  <div id="card">
    <h2 id="card-title">COBB CAN <span>MOVE</span></h2>
    <p id="card-sub">스위치 4개를 켜고 출구로. 그는 아직 당신을 감지하지 못한다.</p>
    <p><kbd>Space</kbd> 시작</p>
  </div>
</div>

<footer>
  <b>WASD / 방향키</b> 이동 · <b>Shift</b> 살금살금(느리지만 조용함) · <b>E</b> 스위치 · <b>R</b> 재시작
</footer>

<script>
(() => {
  "use strict";

  const TILE = 32, W = 24, H = 16;
  const MAP = [
    "########################",
    "#P........#............#",
    "#..#####..#.....S...#..#",
    "#..#......#.#######.#..#",
    "#..#......#.........#..#",
    "#..#.S....#.......#.#..#",
    "#..#..........#...#.#..#",
    "#...........E.#...#.#..#",
    "#.....######..#...#....#",
    "#..##.#.......#...#....#",
    "#..##.#.......#........#",
    "#.....#.......#######..#",
    "#.....#..####..........#",
    "#.S...#..............S.#",
    "#......................#",
    "########################",
  ];

  // Each level keeps the previous senses and adds one. That stacking is the whole game.
  const LEVELS = [
    { verb: "MOVE",  senses: [],                             sub: "스위치 4개를 켜고 출구로. 그는 아직 당신을 감지하지 못한다." },
    { verb: "SEE",   senses: ["see"],                        sub: "시야에 들어가지 마라. 벽이 유일한 친구다." },
    { verb: "HEAR",  senses: ["see", "hear"],                sub: "뛰면 들린다. Shift로 걸어라." },
    { verb: "SMELL", senses: ["see", "hear", "smell"],       sub: "지나온 자리에 냄새가 남는다. 같은 곳을 맴돌지 마라." },
    { verb: "REACH", senses: ["see", "hear", "smell", "reach"], sub: "그의 팔은 눈에 보이는 것보다 길다." },
  ];

  const KO = { see: "본다", hear: "듣는다", smell: "냄새 맡는다", reach: "닿는다" };

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const card = document.getElementById("card");
  const cardTitle = document.getElementById("card-title");
  const cardSub = document.getElementById("card-sub");
  const rulesEl = document.getElementById("rules");
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const keys = Object.create(null);
  const AXIS = {
    ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
    ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  };

  const wall = (c, r) => c < 0 || r < 0 || c >= W || r >= H || MAP[r][c] === "#";
  const tileOf = (p) => ({ c: Math.floor(p.x / TILE), r: Math.floor(p.y / TILE) });
  const center = (c, r) => ({ x: c * TILE + TILE / 2, y: r * TILE + TILE / 2 });
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  // Breadth-first search over open tiles. Cheap enough to rerun a few times a second.
  function pathTo(from, to) {
    const key = (c, r) => r * W + c;
    const prev = new Map();
    const q = [from];
    prev.set(key(from.c, from.r), null);
    for (let i = 0; i < q.length; i++) {
      const cur = q[i];
      if (cur.c === to.c && cur.r === to.r) {
        const out = [];
        let k = key(cur.c, cur.r);
        while (k !== null) {
          out.push({ c: k % W, r: (k - (k % W)) / W });
          k = prev.get(k);
        }
        return out.reverse();
      }
      for (const [dc, dr] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const nc = cur.c + dc, nr = cur.r + dr;
        if (wall(nc, nr) || prev.has(key(nc, nr))) continue;
        prev.set(key(nc, nr), key(cur.c, cur.r));
        q.push({ c: nc, r: nr });
      }
    }
    return null;
  }

  // Sample the segment; any wall tile between the two points blocks sight.
  function lineOfSight(a, b) {
    const steps = Math.ceil(dist(a, b) / 6);
    for (let i = 1; i < steps; i++) {
      const t = i / steps;
      const x = a.x + (b.x - a.x) * t, y = a.y + (b.y - a.y) * t;
      if (wall(Math.floor(x / TILE), Math.floor(y / TILE))) return false;
    }
    return true;
  }

  let level, player, cobb, switches, exitPos, scent, state, shake, elapsed;

  function load(n) {
    level = n;
    scent = [];
    shake = 0;
    elapsed = 0;
    switches = [];
    state = "card";

    for (let r = 0; r < H; r++) {
      for (let c = 0; c < W; c++) {
        const ch = MAP[r][c];
        if (ch === "P") player = { ...center(c, r), sneaking: false, noise: 0 };
        if (ch === "S") switches.push({ ...center(c, r), on: false });
        if (ch === "E") exitPos = { ...center(c, r), c, r };
      }
    }

    // Cobb starts far from you, and gets closer to the start each level.
    const spawn = [{ c: 21, r: 13 }, { c: 16, r: 2 }, { c: 12, r: 10 }, { c: 5, r: 12 }, { c: 8, r: 6 }][n];
    cobb = { ...center(spawn.c, spawn.r), path: null, think: 0, alert: 0, target: null };

    const L = LEVELS[n];
    cardTitle.innerHTML = `COBB CAN <span>${L.verb}</span>`;
    cardSub.textContent = L.sub;
    card.classList.remove("gone");
    rulesEl.innerHTML = L.senses.length
      ? "COBB: " + L.senses.map((s) => `<b>${KO[s]}</b>`).join(" · ")
      : "COBB: 움직인다";
  }

  function has(sense) { return LEVELS[level].senses.includes(sense); }

  function slide(body, dx, dy, half) {
    const step = (ax, v) => {
      const nx = body.x + (ax === "x" ? v : 0);
      const ny = body.y + (ax === "y" ? v : 0);
      const c0 = Math.floor((nx - half) / TILE), c1 = Math.floor((nx + half - 0.01) / TILE);
      const r0 = Math.floor((ny - half) / TILE), r1 = Math.floor((ny + half - 0.01) / TILE);
      for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (wall(c, r)) return;
      body.x = nx; body.y = ny;
    };
    step("x", dx);
    step("y", dy);
  }

  function updatePlayer(dt) {
    let dx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    let dy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
    player.sneaking = !!keys.sneak;
    player.noise = 0;

    if (dx || dy) {
      const len = Math.hypot(dx, dy);
      const speed = player.sneaking ? 56 : 124;
      slide(player, (dx / len) * speed * dt, (dy / len) * speed * dt, 9);
      player.noise = player.sneaking ? 0 : 1;

      if (has("smell")) {
        const last = scent[scent.length - 1];
        if (!last || dist(last, player) > 14) scent.push({ x: player.x, y: player.y, age: 0 });
        if (scent.length > 60) scent.shift();
      }
    }
    for (const s of scent) s.age += dt;
    scent = scent.filter((s) => s.age < 7);

    if (keys.act) {
      for (const s of switches) if (!s.on && dist(s, player) < 26) s.on = true;
    }

    const done = switches.every((s) => s.on);
    if (done && dist(exitPos, player) < 20) {
      if (level + 1 < LEVELS.length) load(level + 1);
      else { state = "won"; cardTitle.innerHTML = "COBB CAN <span>WAIT</span>"; cardSub.textContent = "당신은 나갔다. 그는 아직 거기 있다."; card.classList.remove("gone"); }
    }
  }

  // Cobb picks a target from whichever senses this level granted him.
  function senseTarget() {
    const d = dist(cobb, player);

    if (has("see") && d < 7 * TILE && lineOfSight(cobb, player)) return { ...player, why: "see" };
    if (has("hear") && player.noise && d < 9 * TILE) return { ...player, why: "hear" };

    if (has("smell")) {
      let best = null;
      for (const s of scent) {
        if (s.age < 1.2 || s.age > 7) continue;      // fresh enough to follow, old enough to lag
        const sd = dist(cobb, s);
        if (sd < 6 * TILE && (!best || s.age < best.age)) best = s;
      }
      if (best) return { x: best.x, y: best.y, why: "smell" };
    }
    return null;
  }

  function updateCobb(dt) {
    const found = senseTarget();
    if (found) { cobb.target = found; cobb.alert = 3.5; }
    else cobb.alert = Math.max(0, cobb.alert - dt);

    if (!cobb.target || (cobb.alert === 0 && dist(cobb, cobb.target) < 12)) {
      // Lost the scent. Wander toward a random open tile.
      let c, r;
      do { c = 1 + Math.floor(Math.random() * (W - 2)); r = 1 + Math.floor(Math.random() * (H - 2)); } while (wall(c, r));
      cobb.target = { ...center(c, r), why: "patrol" };
      cobb.path = null;
    }

    cobb.think -= dt;
    if (cobb.think <= 0 || !cobb.path) {
      cobb.think = 0.28;
      cobb.path = pathTo(tileOf(cobb), tileOf(cobb.target));
      if (cobb.path) cobb.path.shift();
    }

    if (cobb.path && cobb.path.length) {
      const node = center(cobb.path[0].c, cobb.path[0].r);
      const speed = cobb.alert > 0 ? 82 : 44;
      const dx = node.x - cobb.x, dy = node.y - cobb.y;
      const len = Math.hypot(dx, dy) || 1;
      slide(cobb, (dx / len) * speed * dt, (dy / len) * speed * dt, 10);
      if (dist(cobb, node) < 3) cobb.path.shift();
    }

    const grab = (has("reach") ? 1.7 : 0.6) * TILE;
    if (dist(cobb, player) < grab) {
      state = "dead";
      shake = 1;
      cardTitle.innerHTML = has("reach") ? "COBB <span>REACHED</span> YOU" : "COBB <span>FOUND</span> YOU";
      cardSub.textContent = "Space로 이 방을 다시.";
      card.classList.remove("gone");
    }
  }

  function drawRoom() {
    for (let r = 0; r < H; r++) {
      for (let c = 0; c < W; c++) {
        const x = c * TILE, y = r * TILE;
        if (MAP[r][c] === "#") {
          ctx.fillStyle = "#2e2830"; ctx.fillRect(x, y, TILE, TILE);
          ctx.fillStyle = "#3d3540"; ctx.fillRect(x, y, TILE, 3);
        } else {
          ctx.fillStyle = (c + r) % 2 ? "#1c181d" : "#1f1b20";
          ctx.fillRect(x, y, TILE, TILE);
        }
      }
    }
  }

  function render(t) {
    ctx.save();
    if (shake > 0 && !calm) {
      ctx.translate((Math.random() - 0.5) * shake * 10, (Math.random() - 0.5) * shake * 10);
      shake = Math.max(0, shake - 0.02);
    }

    ctx.fillStyle = "#0d0b0e";
    ctx.fillRect(-20, -20, canvas.width + 40, canvas.height + 40);
    drawRoom();

    if (has("smell")) {
      for (const s of scent) {
        ctx.globalAlpha = Math.max(0, 0.16 * (1 - s.age / 7));
        ctx.fillStyle = "#6fd0c8";
        ctx.beginPath(); ctx.arc(s.x, s.y, 5, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    for (const s of switches) {
      ctx.fillStyle = s.on ? "#6fd0c8" : "#3d3540";
      ctx.fillRect(s.x - 7, s.y - 7, 14, 14);
      ctx.strokeStyle = "#6fd0c8"; ctx.lineWidth = 1;
      ctx.globalAlpha = s.on ? 1 : 0.4;
      ctx.strokeRect(s.x - 10, s.y - 10, 20, 20);
      ctx.globalAlpha = 1;
    }

    const open = switches.every((s) => s.on);
    ctx.globalAlpha = open ? (calm ? 1 : 0.65 + Math.sin(t * 3) * 0.35) : 0.18;
    ctx.strokeStyle = "#d4703a"; ctx.lineWidth = 2;
    ctx.strokeRect(exitPos.x - 11, exitPos.y - 11, 22, 22);
    ctx.globalAlpha = 1;

    // Cobb: a tall smear, never quite drawn in full.
    const seen = dist(cobb, player) < 150 || cobb.alert > 0;
    ctx.globalAlpha = seen ? 1 : 0.22;
    ctx.fillStyle = cobb.alert > 0 ? "#8e2b34" : "#3d3540";
    ctx.beginPath(); ctx.roundRect(cobb.x - 9, cobb.y - 14, 18, 28, 5); ctx.fill();
    if (has("reach")) {
      ctx.strokeStyle = "#8e2b34"; ctx.globalAlpha = seen ? 0.3 : 0.1; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(cobb.x, cobb.y, 1.7 * TILE, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    ctx.fillStyle = "#ded6d0";
    ctx.beginPath(); ctx.arc(player.x, player.y, 8, 0, Math.PI * 2); ctx.fill();
    if (player.sneaking) {
      ctx.strokeStyle = "#7a6f78"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(player.x, player.y, 12, 0, Math.PI * 2); ctx.stroke();
    } else if (player.noise) {
      ctx.strokeStyle = "#8e2b34"; ctx.globalAlpha = 0.5;
      ctx.beginPath(); ctx.arc(player.x, player.y, 18 + (calm ? 0 : Math.sin(t * 9) * 4), 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // Darkness. The room only exists where the light reaches.
    const light = ctx.createRadialGradient(player.x, player.y, 24, player.x, player.y, 132);
    light.addColorStop(0, "rgba(13,11,14,0)");
    light.addColorStop(0.75, "rgba(13,11,14,0.72)");
    light.addColorStop(1, "rgba(13,11,14,0.94)");
    ctx.fillStyle = light;
    ctx.fillRect(-20, -20, canvas.width + 40, canvas.height + 40);
    ctx.restore();
  }

  let last = performance.now(), acc = 0;
  const STEP = 1 / 120;

  function frame(now) {
    const delta = Math.min((now - last) / 1000, 0.25);
    last = now;
    if (state === "play") {
      acc += delta;
      while (acc >= STEP) { elapsed += STEP; updatePlayer(STEP); updateCobb(STEP); acc -= STEP; }
    } else acc = 0;
    render(now / 1000);
    requestAnimationFrame(frame);
  }

  addEventListener("keydown", (e) => {
    if (e.code === "Space") {
      e.preventDefault();
      if (state === "card") { state = "play"; card.classList.add("gone"); }
      else if (state === "dead") load(level);
      else if (state === "won") load(0);
      return;
    }
    if (e.code === "KeyR") return load(level);
    if (e.code === "KeyE") keys.act = true;
    if (e.code === "ShiftLeft" || e.code === "ShiftRight") keys.sneak = true;
    const a = AXIS[e.code];
    if (a) { keys[a] = true; e.preventDefault(); }
  });

  addEventListener("keyup", (e) => {
    if (e.code === "KeyE") keys.act = false;
    if (e.code === "ShiftLeft" || e.code === "ShiftRight") keys.sneak = false;
    const a = AXIS[e.code];
    if (a) keys[a] = false;
  });

  load(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
