<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Team Vault — 포켓몬 챔피언스 팀 저장소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <span class="mark"></span>
    <span class="brand-name">TEAM VAULT</span>
    <span class="brand-sub">포켓몬 챔피언스 빌드 저장소</span>
  </a>
  <nav class="nav-links">
    <a href="index.html" class="active">갤러리</a>
    <a href="builder.html">팀 빌더</a>
  </nav>
</header>

<main>
  <div class="page-head">
    <h1>팀을 만들고, 저장하고, 공유하세요</h1>
    <p>싱글/더블 배틀용 팀 구성을 빌더에서 만들고, 이 저장소에 샘플로 보관하거나 내 브라우저에 저장할 수 있습니다.</p>
  </div>

  <div class="toolbar">
    <div class="chip-group" id="sourceTabs">
      <button data-source="samples" class="active">샘플 팀</button>
      <button data-source="mine">내 팀 (이 브라우저)</button>
    </div>
    <div class="chip-group" id="formatTabs">
      <button data-format="all" class="active">전체</button>
      <button data-format="singles">싱글</button>
      <button data-format="doubles">더블</button>
    </div>
    <div class="spacer"></div>
    <input type="search" id="searchBox" placeholder="팀 이름 또는 포켓몬 검색" />
    <a class="btn" href="builder.html">+ 새 팀 만들기</a>
  </div>

  <div id="teamGrid" class="team-grid"></div>
  <div id="emptyState" class="empty-state" style="display:none;">
    <h3>아직 팀이 없어요</h3>
    <p>빌더에서 첫 팀을 만들어보세요.</p>
  </div>
</main>

<footer>
  Team Vault는 PokeAPI의 공개 데이터를 사용하는 팬 제작 도구입니다. Pokémon, Pokémon Champions는 각 상표권자의 자산입니다.
</footer>

<script src="js/pokeapi.js"></script>
<script src="js/storage.js"></script>
<script src="js/gallery.js"></script>
</body>
</html>
