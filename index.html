<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>소방관 - 페이즈 1: 붕괴하는 화재현장</title>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<style>
  html,body{overflow:hidden;width:100%;height:100%;margin:0;padding:0;background:#000;font-family:sans-serif;}
  #renderCanvas{width:100%;height:100%;touch-action:none;display:block;}
  #hud{position:absolute;top:12px;left:12px;color:#fff;z-index:10;pointer-events:none;}
  #hpWrap{width:220px;height:16px;background:rgba(0,0,0,.6);border:2px solid #fff;border-radius:8px;overflow:hidden;}
  #hpBar{height:100%;width:100%;background:linear-gradient(90deg,#2ecc71,#f1c40f,#e74c3c);
         background-size:220px 100%;transition:width .15s linear;}
  #timer{margin-top:8px;font-size:22px;font-weight:bold;text-shadow:0 2px 4px #000;}
  #objective{margin-top:4px;font-size:13px;background:rgba(0,0,0,.5);padding:6px 10px;border-radius:6px;display:inline-block;}
  #torchUI{position:absolute;top:12px;right:12px;color:#ffd;background:rgba(0,0,0,.5);
           padding:8px 12px;border-radius:6px;font-size:13px;z-index:10;pointer-events:none;}
  #msg{position:absolute;bottom:12%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);
       color:#fff;padding:14px 28px;border:3px solid #fff;border-radius:8px;font-size:18px;z-index:10;
       pointer-events:none;display:none;text-align:center;}
  #damageVignette{position:absolute;inset:0;pointer-events:none;z-index:5;opacity:0;
       background:radial-gradient(ellipse at center, transparent 45%, rgba(200,20,0,.85) 100%);
       transition:opacity .12s linear;}
  #overlay{position:absolute;inset:0;background:rgba(0,0,0,.85);color:#fff;z-index:20;display:none;
       flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  #overlay h1{font-size:44px;margin:0 0 12px;}
  #overlay button{margin-top:18px;padding:12px 28px;font-size:16px;border:none;border-radius:6px;
       background:#e74c3c;color:#fff;cursor:pointer;}
</style>
</head>
<body>
<div id="hud">
  <div id="hpWrap"><div id="hpBar"></div></div>
  <div id="timer">02:00</div>
  <div id="objective">목표: 생존자를 찾아라 · WASD 이동 · 드래그 시선 · F 손전등 · Space 점프</div>
</div>
<div id="torchUI">손전등: 켜짐 (F)</div>
<div id="msg"></div>
<div id="damageVignette"></div>
<div id="overlay"><h1 id="overlayTitle"></h1><p id="overlayText"></p><button onclick="location.reload()">다시 시도</button></div>
<canvas id="renderCanvas"></canvas>

<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true);

// ───────── 전역 게임 상태 (페이즈 2·3 확장을 위해 미리 구조화) ─────────
const GAME = {
  phase: 1,          // 1:붕괴탈출  2:구출과상실  3:도주추격
  hp: 100,
  timeLeft: 120,     // 초
  over: false,
  survivorFound: false
};

const hpBar = document.getElementById("hpBar");
const timerEl = document.getElementById("timer");
const msgEl = document.getElementById("msg");
const vignette = document.getElementById("damageVignette");
const torchUI = document.getElementById("torchUI");
const overlay = document.getElementById("overlay");

function showMessage(t, ms=2600){ msgEl.innerText=t; msgEl.style.display="block";
  clearTimeout(showMessage._t); showMessage._t=setTimeout(()=>msgEl.style.display="none", ms); }
function endGame(title, text){
  if(GAME.over) return; GAME.over = true;
  document.getElementById("overlayTitle").innerText = title;
  document.getElementById("overlayText").innerText = text;
  overlay.style.display = "flex";
}

const createScene = function(){
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color3(0.05,0.03,0.02);

  // ───────── 연기: 시야 제한 (시간이 갈수록 짙어짐) ─────────
  scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
  scene.fogColor = new BABYLON.Color3(0.18,0.14,0.12);
  scene.fogDensity = 0.035;

  const camera = new BABYLON.UniversalCamera("cam", new BABYLON.Vector3(0,1.6,2.5), scene);
  camera.setTarget(new BABYLON.Vector3(0,1.6,-4));
  camera.attachControl(canvas,true);
  camera.inertia = 0;
  camera.inputs.removeByType("FreeCameraMouseInput");
  camera.inputs.removeByType("FreeCameraTouchInput");
  camera.inputs.removeByType("FreeCameraKeyboardMoveInput");
  scene.collisionsEnabled = true;
  camera.checkCollisions = true;
  camera.applyGravity = false;
  camera.ellipsoid = new BABYLON.Vector3(0.5,0.8,0.5);

  // ───────── 재질 ─────────
  const mk = (n,r,g,b,emis)=>{ const m=new BABYLON.StandardMaterial(n,scene);
    m.diffuseColor=new BABYLON.Color3(r,g,b); if(emis) m.emissiveColor=emis; return m; };
  const matWall  = mk("w",0.30,0.26,0.24);
  const matFloor = mk("f",0.20,0.17,0.15);
  const matCeil  = mk("c",0.22,0.19,0.17);
  const matStair = mk("s",0.28,0.23,0.19);
  const matRubble= mk("r",0.16,0.14,0.13);
  const matFire  = mk("fi",1,0.4,0.05, new BABYLON.Color3(1,0.42,0.06));

  // ───────── 헬퍼 ─────────
  function makeWall(x,y,z,w,h,d,mat){ const b=BABYLON.MeshBuilder.CreateBox("wall",{width:w,height:h,depth:d},scene);
    b.position.set(x,y,z); b.material=mat||matWall; b.checkCollisions=true; return b; }
  function makeFloor(x,y,z,w,d,mat){ const f=BABYLON.MeshBuilder.CreateBox("floor",{width:w,height:0.2,depth:d},scene);
    f.position.set(x,y-0.1,z); f.material=mat||matFloor; f.isWalkable=true; f.checkCollisions=false; return f; }
  function makeCeiling(x,y,z,w,d,mat){ const c=BABYLON.MeshBuilder.CreateBox("ceil",{width:w,height:0.2,depth:d},scene);
    c.position.set(x,y,z); c.material=mat||matCeil; return c; }
  function makeDoorwayWall(z,totalW,height,gapW,gapH,mat){
    const side=(totalW-gapW)/2;
    makeWall(-(gapW/2+side/2),height/2,z,side,height,0.2,mat);
    makeWall( (gapW/2+side/2),height/2,z,side,height,0.2,mat);
    makeWall(0,(gapH+height)/2,z,gapW,height-gapH,0.2,mat);
  }
  function makeStairs(x,baseY,startZ,steps,stepW,stepH,stepD,dir,mat){
    for(let i=0;i<steps;i++){ const top=baseY+(i+1)*stepH;
      const s=BABYLON.MeshBuilder.CreateBox("step",{width:stepW,height:(top-baseY),depth:stepD},scene);
      s.position.set(x,baseY+(top-baseY)/2,startZ+dir*(i*stepD));
      s.material=mat||matStair; s.isWalkable=true; s.checkCollisions=false; }
    return baseY+steps*stepH;
  }

  // ───────── 맵: 방A → 복도(무너짐) → 방B(2층 다락 우회로) ─────────
  makeFloor(0,0,-8,26,44,matFloor);
  makeWall(0,1.5,4,8,3,0.2); makeWall(-4,1.5,0,0.2,3,8); makeWall(4,1.5,0,0.2,3,8);
  makeCeiling(0,3,0,8,8);
  makeDoorwayWall(-4,8,6,2,2.6);
  makeWall(-4,3,-8,0.2,6,8); makeWall(4,3,-8,0.2,6,8);
  makeCeiling(0,6,-8,8,8);
  makeWall(-4,3,-16,0.2,6,8); makeWall(4,3,-16,0.2,6,8);
  makeWall(0,3,-20,8,6,0.2);
  makeCeiling(0,6,-16,8,8);
  makeDoorwayWall(-12,8,6,2.4,2.8);

  // 1층 직통 통로 바닥 (여기가 나중에 무너져서 못 지나감)
  const collapseFloor = makeFloor(0,0,-14,3.4,4,matFloor);

  // 2층 우회로: 계단 → 다락 → 건너편으로 내려가는 계단
  const loftY = makeStairs(2.75,0,-5,10,1.5,0.3,0.4,-1);              // 방B에서 올라감
  makeFloor(0,loftY,-10.25,8,3.5,matStair);                            // 다락
  makeFloor(-2.6,loftY,-14,2.4,4,matStair);                            // 무너진 곳 위를 건너는 다리
  makeStairs(-2.6,loftY,-16.5,10,2.4,-0.3,0.4,-1,matStair);            // 반대편으로 내려감(음수 높이 = 하강)
  makeWall(1.2,loftY+0.6,-14,0.2,1.2,4);                               // 다리 난간

  // ───────── 불 (닿으면 체력 감소) ─────────
  const fires = [];
  function makeFire(x,y,z,size){
    const f=BABYLON.MeshBuilder.CreateBox("fire",{size:size},scene);
    f.position.set(x,y,z); f.material=matFire;
    const light=new BABYLON.PointLight("fl",new BABYLON.Vector3(x,y+0.5,z),scene);
    light.diffuse=new BABYLON.Color3(1,0.45,0.1); light.intensity=1.0; light.range=9;
    fires.push({mesh:f,light:light,radius:2.4}); return f;
  }
  makeFire(-3,0.5,-1,1);  makeFire(3.2,0.5,-6.5,1.2);
  makeFire(-3.2,0.5,-9,1); makeFire(2.8,0.5,-15,1.2); makeFire(-3,0.5,-18,1);

  // 불 일렁임
  scene.onBeforeRenderObservable.add(()=>{
    const t=performance.now()/300;
    fires.forEach((f,i)=>{
      const s=1+Math.sin(t+i)*0.12;
      f.mesh.scaling.set(s,1+Math.sin(t*1.7+i)*0.2,s);
      f.light.intensity=0.85+Math.sin(t*2+i)*0.25;
    });
  });

  // ───────── 생존자 (페이즈 2 진입 지점, 지금은 발견까지) ─────────
  const survivor = BABYLON.MeshBuilder.CreateCapsule("survivor",{height:1.6,radius:0.35},scene);
  survivor.position.set(-2.6,0.8,-18.5);
  survivor.material = mk("sv",0.2,0.45,0.8,new BABYLON.Color3(0.05,0.15,0.35));

  // ───────── 조명 & 손전등 ─────────
  const amb = new BABYLON.HemisphericLight("amb",new BABYLON.Vector3(0,1,0),scene);
  amb.intensity = 0.22; amb.diffuse = new BABYLON.Color3(1,0.7,0.5);

  const torch = new BABYLON.SpotLight("torch",BABYLON.Vector3.Zero(),new BABYLON.Vector3(0,0,1),Math.PI/5,8,scene);
  torch.parent = camera; torch.range = 24; torch.diffuse = new BABYLON.Color3(1,0.96,0.85);
  let torchOn = true; const TORCH_POWER = 2.4; torch.intensity = TORCH_POWER;
  function setTorch(on){ torchOn=on; torch.intensity=on?TORCH_POWER:0;
    torchUI.innerText = on?"손전등: 켜짐 (F)":"손전등: 꺼짐 (F)"; }
  window.addEventListener("keydown",e=>{ if(e.code==="KeyF") setTorch(!torchOn); });

  // ───────── 시선 ─────────
  const LOOK=0.004; let drag=false,lx=0,ly=0;
  canvas.addEventListener("pointerdown",e=>{drag=true;lx=e.clientX;ly=e.clientY;});
  const stop=()=>drag=false;
  canvas.addEventListener("pointerup",stop); canvas.addEventListener("pointerleave",stop); canvas.addEventListener("pointercancel",stop);
  canvas.addEventListener("pointermove",e=>{ if(!drag)return;
    camera.rotation.y+=(e.clientX-lx)*LOOK; camera.rotation.x+=(e.clientY-ly)*LOOK;
    lx=e.clientX; ly=e.clientY; });
  scene.onBeforeRenderObservable.add(()=>{
    camera.rotation.x = Math.max(-1.2, Math.min(1.2, camera.rotation.x));
  });

  // ───────── 이동 ─────────
  const SPEED=3.4; const keys={};
  window.addEventListener("keydown",e=>keys[e.code]=true);
  window.addEventListener("keyup",e=>keys[e.code]=false);
  scene.onBeforeRenderObservable.add(()=>{
    if(GAME.over){ camera.cameraDirection.setAll(0); return; }
    const yaw=camera.rotation.y;
    const fw=new BABYLON.Vector3(Math.sin(yaw),0,Math.cos(yaw));
    const rt=new BABYLON.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
    const mv=BABYLON.Vector3.Zero();
    if(keys["KeyW"]) mv.addInPlace(fw);
    if(keys["KeyS"]) mv.subtractInPlace(fw);
    if(keys["KeyD"]) mv.addInPlace(rt);
    if(keys["KeyA"]) mv.subtractInPlace(rt);
    if(mv.lengthSquared()>0){ const dt=engine.getDeltaTime()/1000; mv.normalize().scaleInPlace(SPEED*dt); }
    camera.cameraDirection.copyFrom(mv);
  });

  // ───────── 세로 이동 (ground-follow) ─────────
  const EYE=1.6, GRAV=-0.02, JUMP=0.2;
  let velY=0, grounded=true;
  window.addEventListener("keydown",e=>{ if(e.code==="Space"&&grounded&&!GAME.over){velY=JUMP;grounded=false;} });
  const DOWN=new BABYLON.Vector3(0,-1,0);
  scene.onBeforeRenderObservable.add(()=>{
    const hit=scene.pickWithRay(new BABYLON.Ray(camera.position.add(new BABYLON.Vector3(0,0.1,0)),DOWN,14),
                                m=>m.isWalkable===true);
    const floorY=(hit&&hit.hit)?hit.pickedPoint.y:-Infinity;
    const targetY=floorY+EYE;
    if(grounded){
      const d=targetY-camera.position.y;
      if(d>0.01) camera.position.y+=Math.min(d,0.18);
      else if(d<-0.6){grounded=false;velY=0;}
      else if(d<-0.01) camera.position.y+=Math.max(d,-0.18);
      else camera.position.y=targetY;
    } else {
      velY+=GRAV; camera.position.y+=velY;
      if(camera.position.y<=targetY){camera.position.y=targetY;velY=0;grounded=true;}
    }
    // 구덩이로 떨어짐 = 사망
    if(camera.position.y < -6) endGame("추락","무너진 바닥 아래로 떨어졌다.");
  });

  // ───────── 체력: 불 근접 + 연기 데미지 ─────────
  let shakeUntil = 0;
  scene.onBeforeRenderObservable.add(()=>{
    if(GAME.over) return;
    const dt = engine.getDeltaTime()/1000;
    let dps = 0;
    // 불에 가까울수록 강한 피해
    fires.forEach(f=>{
      const d = BABYLON.Vector3.Distance(camera.position, f.mesh.position);
      if(d < f.radius) dps += (1 - d/f.radius) * 34;
    });
    // 연기: 항상 약하게 (짙어질수록 증가)
    dps += scene.fogDensity * 55;

    if(dps > 0.6){
      GAME.hp -= dps*dt;
      vignette.style.opacity = Math.min(0.9, dps/22);
    } else {
      GAME.hp = Math.min(100, GAME.hp + 1.6*dt); // 안전지대 미세 회복
      vignette.style.opacity = Math.max(0, (100-GAME.hp)/380);
    }
    GAME.hp = Math.max(0, GAME.hp);
    hpBar.style.width = GAME.hp + "%";
    if(GAME.hp <= 0) endGame("사망", "화염과 연기에 쓰러졌다.");

    // 붕괴 시 화면 흔들림
    if(performance.now() < shakeUntil){
      camera.position.x += (Math.random()-0.5)*0.05;
      camera.position.z += (Math.random()-0.5)*0.05;
    }
  });

  // ───────── 붕괴 이벤트 (시간 기반, 순차 발생) ─────────
  function dropRubble(x,y,z,w,h,d){
    const r=BABYLON.MeshBuilder.CreateBox("rubble",{width:w,height:h,depth:d},scene);
    r.position.set(x,y+6,z); r.material=matRubble; r.checkCollisions=true;
    r.rotation.set(Math.random()*0.4, Math.random()*Math.PI, Math.random()*0.4);
    let vy=0;
    const fall=scene.onBeforeRenderObservable.add(()=>{
      vy-=0.03; r.position.y+=vy;
      if(r.position.y<=y){ r.position.y=y; scene.onBeforeRenderObservable.remove(fall); }
    });
    return r;
  }

  const collapseEvents = [
    { at: 95, run(){ // 천장 일부 낙하 (방B 입구 좁아짐)
        shakeUntil = performance.now()+900;
        dropRubble(-2.4,0.7,-6, 2.2,1.4,2.2);
        showMessage("쿠구궁! 천장이 무너지고 있다!");
      }},
    { at: 70, run(){ // 1층 직통 통로 붕괴 → 우회 강제
        shakeUntil = performance.now()+1400;
        collapseFloor.isWalkable = false;     // 밟을 수 없게
        collapseFloor.material = matRubble;
        collapseFloor.position.y -= 3;        // 아래로 꺼짐
        dropRubble(0,0.9,-12.6, 3.4,1.8,1.2);
        showMessage("바닥이 무너졌다! 다른 길을 찾아야 한다.");
        makeFire(0,0.5,-13,1.4);
      }},
    { at: 40, run(){
        shakeUntil = performance.now()+1000;
        dropRubble(3,1.0,-17, 2.0,2.0,2.0);
        showMessage("건물이 오래 버티지 못한다!");
        makeFire(-1.5,0.5,-6,1.1);
      }},
    { at: 18, run(){
        shakeUntil = performance.now()+1600;
        showMessage("붕괴 직전이다! 서둘러!");
        scene.fogColor = new BABYLON.Color3(0.25,0.12,0.08);
      }},
  ];

  // ───────── 타이머 & 연기 증가 ─────────
  const tick = setInterval(()=>{
    if(GAME.over){ clearInterval(tick); return; }
    GAME.timeLeft--;
    const m=String(Math.floor(GAME.timeLeft/60)).padStart(2,"0");
    const s=String(GAME.timeLeft%60).padStart(2,"0");
    timerEl.innerText = `${m}:${s}`;
    timerEl.style.color = GAME.timeLeft<=30 ? "#ff5b4a" : "#fff";

    scene.fogDensity = Math.min(0.075, scene.fogDensity + 0.00035); // 연기 짙어짐

    collapseEvents.forEach(ev=>{
      if(!ev.done && GAME.timeLeft === ev.at){ ev.done=true; ev.run(); }
    });

    if(GAME.timeLeft<=0) endGame("붕괴", "건물이 완전히 무너졌다.");
  },1000);

  // ───────── 생존자 발견 → (페이즈 2 자리) ─────────
  scene.onPointerDown = (evt,pick)=>{
    if(GAME.over || !pick.hit) return;
    if(pick.pickedMesh===survivor && !GAME.survivorFound){
      if(BABYLON.Vector3.Distance(camera.position, survivor.position) > 3.5){
        showMessage("너무 멀다. 더 가까이 가야 한다."); return;
      }
      GAME.survivorFound = true;
      GAME.phase = 2;
      showMessage("생존자를 발견했다! [페이즈 2 — 아직 구현 전]", 4000);
      document.getElementById("objective").innerText = "목표: 생존자와 함께 탈출하라 (페이즈 2)";
    }
  };

  return scene;
};

const scene = createScene();
engine.runRenderLoop(()=>scene.render());
window.addEventListener("resize",()=>engine.resize());
</script>
</body>
</html>
