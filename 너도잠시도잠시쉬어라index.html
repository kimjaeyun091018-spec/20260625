<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>소방관 - 오피스 화재현장</title>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<style>
  html,body{overflow:hidden;width:100%;height:100%;margin:0;padding:0;background:#000;font-family:sans-serif;}
  #renderCanvas{width:100%;height:100%;touch-action:none;display:block;}
  #hud{position:absolute;top:12px;left:12px;color:#fff;z-index:10;pointer-events:none;font-size:12px;}
  .bar{width:200px;height:12px;background:rgba(0,0,0,.6);border:1.5px solid rgba(255,255,255,.7);border-radius:6px;overflow:hidden;margin-top:2px;}
  .bar > div{height:100%;width:100%;transition:width .12s linear;}
  .lbl{margin-top:6px;opacity:.85;}
  #hpBar{background:#e74c3c;} #oxyBar{background:#5bc8f5;}
  #stamBar{background:#7ed957;} #integBar{background:#8fd6ff;}
  #timer{margin-top:8px;font-size:20px;font-weight:bold;text-shadow:0 2px 4px #000;}
  #objective{margin-top:5px;font-size:12px;background:rgba(0,0,0,.6);padding:6px 10px;border-radius:6px;display:inline-block;max-width:330px;}
  #floorTag{margin-top:5px;font-size:12px;color:#ffd7a0;background:rgba(0,0,0,.5);padding:4px 8px;border-radius:5px;display:inline-block;}
  #rightUI{position:absolute;top:12px;right:12px;color:#ffd;background:rgba(0,0,0,.5);padding:9px 12px;border-radius:6px;font-size:12px;z-index:10;pointer-events:none;text-align:right;line-height:1.7;}
  #battWrap{margin-top:5px;width:110px;height:7px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden;margin-left:auto;}
  #battBar{height:100%;width:100%;background:#ffd76a;}
  #maskState{color:#8fe6a0;}
  #prompt{position:absolute;bottom:26%;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.6);
          padding:6px 14px;border-radius:6px;font-size:14px;z-index:11;pointer-events:none;display:none;}
  #msg{position:absolute;bottom:13%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.9);color:#fff;padding:13px 26px;border:3px solid #fff;border-radius:8px;font-size:17px;z-index:12;pointer-events:none;display:none;text-align:center;max-width:72%;}
  #vig{position:absolute;inset:0;pointer-events:none;z-index:5;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(200,20,0,.85) 100%);transition:opacity .12s linear;}
  #chokeVig{position:absolute;inset:0;pointer-events:none;z-index:6;opacity:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.95) 95%);transition:opacity .4s linear;}
  #goggles{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:7;opacity:0;transition:opacity .3s;display:block;}
  #fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:15;transition:opacity .7s;}
  #overlay{position:absolute;inset:0;background:rgba(0,0,0,.9);color:#fff;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;}
  #overlay h1{font-size:40px;margin:0 0 10px;}
  #overlay button{margin-top:18px;padding:12px 28px;font-size:16px;border:none;border-radius:6px;background:#e74c3c;color:#fff;cursor:pointer;}
  #crosshair{position:absolute;top:50%;left:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:rgba(255,255,255,.5);z-index:8;pointer-events:none;}
</style>
</head>
<body>
<div id="hud">
  <div class="lbl">체력</div><div class="bar"><div id="hpBar"></div></div>
  <div class="lbl">산소</div><div class="bar"><div id="oxyBar"></div></div>
  <div class="lbl">스태미나</div><div class="bar"><div id="stamBar"></div></div>
  <div class="lbl">건물 안정도</div><div class="bar"><div id="integBar"></div></div>
  <div id="timer">07:00</div>
  <div id="floorTag">현재: 건물 외부</div>
  <div id="objective">목표: 정문으로 진입 · 열리는 문이 올바른 길이다</div>
</div>
<div id="rightUI">
  <div id="torchLine">손전등: 켜짐 (F)</div>
  <div id="battWrap"><div id="battBar"></div></div>
  <div id="maskState">방독면: 착용 (G)</div>
  <div style="opacity:.7">Shift 달리기 · E 문 열기/상호작용</div>
</div>
<div id="crosshair"></div>
<svg id="goggles" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="gblur"><feGaussianBlur stdDeviation="9"/></filter>
    <mask id="gm" maskUnits="userSpaceOnUse">
      <rect id="gmRect" x="0" y="0" fill="#fff"/>
      <g filter="url(#gblur)"><circle id="gL" fill="#000"/><circle id="gR" fill="#000"/></g>
    </mask>
  </defs>
  <rect id="gOverlay" x="0" y="0" fill="#03050a" mask="url(#gm)"/>
</svg>
<div id="prompt"></div><div id="msg"></div><div id="vig"></div><div id="chokeVig"></div><div id="fade"></div>
<div id="overlay"><h1 id="oTitle"></h1><p id="oText"></p><button onclick="location.reload()">다시 시도</button></div>
<canvas id="renderCanvas"></canvas>

<script>
const canvas=document.getElementById("renderCanvas");
const engine=new BABYLON.Engine(canvas,true,{stencil:true});
const GAME={phase:1,hp:100,oxygen:100,stamina:100,integrity:100,battery:100,
            timeLeft:420,over:false,maskOn:true,running:false,
            survivorFound:false,survivorFollowing:false,cutscenePlayed:false,chasing:false};
const $=id=>document.getElementById(id);
const hpBar=$("hpBar"),oxyBar=$("oxyBar"),stamBar=$("stamBar"),integBar=$("integBar"),
      timerEl=$("timer"),msgEl=$("msg"),vig=$("vig"),chokeVig=$("chokeVig"),goggles=$("goggles"),
      overlay=$("overlay"),objEl=$("objective"),floorTag=$("floorTag"),battBar=$("battBar"),
      fade=$("fade"),torchLine=$("torchLine"),maskState=$("maskState"),promptEl=$("prompt");

function layoutGoggles(){
  const w=innerWidth,h=innerHeight,r=Math.min(w*0.19,h*0.34),cy=h*0.5,sep=r*0.98;
  $("gmRect").setAttribute("width",w);$("gmRect").setAttribute("height",h);
  $("gOverlay").setAttribute("width",w);$("gOverlay").setAttribute("height",h);
  $("gL").setAttribute("cx",w/2-sep);$("gL").setAttribute("cy",cy);$("gL").setAttribute("r",r);
  $("gR").setAttribute("cx",w/2+sep);$("gR").setAttribute("cy",cy);$("gR").setAttribute("r",r);
}
layoutGoggles();addEventListener("resize",layoutGoggles);

function showMessage(t,ms=2600){msgEl.innerText=t;msgEl.style.display="block";
  clearTimeout(showMessage._t);showMessage._t=setTimeout(()=>msgEl.style.display="none",ms);}
function endGame(title,text){if(GAME.over)return;GAME.over=true;
  $("oTitle").innerText=title;$("oText").innerText=text;overlay.style.display="flex";}

/* ═══ 사운드 ═══ */
let actx=null;
function initAudio(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}}
addEventListener("keydown",initAudio,{once:true});addEventListener("pointerdown",initAudio,{once:true});
function playNoise(dur,freq,gain,type="lowpass"){
  if(!actx)return;
  const len=Math.max(1,Math.floor(actx.sampleRate*dur));
  const buf=actx.createBuffer(1,len,actx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++){const e=Math.pow(1-i/len,2.6);d[i]=(Math.random()*2-1)*e;}
  const s=actx.createBufferSource();s.buffer=buf;
  const f=actx.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=0.8;
  const g=actx.createGain();g.gain.value=gain;
  s.connect(f);f.connect(g);g.connect(actx.destination);s.start();
}
function footstep(st){const p=0.85+Math.random()*0.35;playNoise(0.11,(st?1500:780)*p,st?0.16:0.22);}
function breath(h){h?playNoise(0.42,480,0.13,"bandpass"):playNoise(0.30,320,0.06,"lowpass");}
function rumble(){playNoise(1.2,120,0.38,"lowpass");}
function doorCreak(){playNoise(0.55,320,0.14,"bandpass");}
function doorLocked(){playNoise(0.16,180,0.30,"lowpass");}
function scream(){
  if(!actx)return;
  const o=actx.createOscillator(),g=actx.createGain(),f=actx.createBiquadFilter(),t=actx.currentTime;
  f.type="bandpass";f.frequency.value=1200;f.Q.value=3;o.type="sawtooth";
  o.frequency.setValueAtTime(650,t);
  o.frequency.exponentialRampToValueAtTime(1600,t+0.22);
  o.frequency.exponentialRampToValueAtTime(380,t+1.15);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.20,t+0.05);
  g.gain.exponentialRampToValueAtTime(0.0001,t+1.25);
  o.connect(f);f.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+1.3);
}

const createScene=function(){
  const scene=new BABYLON.Scene(engine);
  scene.clearColor=new BABYLON.Color3(0.03,0.03,0.05);
  scene.fogMode=BABYLON.Scene.FOGMODE_EXP2;
  scene.fogColor=new BABYLON.Color3(0.12,0.09,0.08);
  scene.fogDensity=0.005;

  const BX=45,BZ=60,FH=5,H3=FH*3;
  const camera=new BABYLON.UniversalCamera("cam",new BABYLON.Vector3(0,1.7,BZ+12),scene);
  camera.setTarget(new BABYLON.Vector3(0,1.7,BZ));
  camera.attachControl(canvas,true);camera.inertia=0;
  camera.inputs.removeByType("FreeCameraMouseInput");
  camera.inputs.removeByType("FreeCameraTouchInput");
  camera.inputs.removeByType("FreeCameraKeyboardMoveInput");
  camera.minZ=0.15;camera.fov=0.95;
  scene.collisionsEnabled=true;camera.checkCollisions=true;
  camera.applyGravity=false;camera.ellipsoid=new BABYLON.Vector3(0.5,0.85,0.5);

  function mkMat(n,r,g,b,emis){
    const m=new BABYLON.StandardMaterial(n,scene);
    m.diffuseColor=new BABYLON.Color3(r,g,b);
    m.specularColor=new BABYLON.Color3(0.05,0.05,0.05);
    if(emis)m.emissiveColor=emis;
    m.maxSimultaneousLights=8;return m;
  }
  /* 오피스 톤 재질 */
  const matWall=mkMat("w",0.55,0.53,0.50),      // 밝은 사무실 벽
        matFloor=mkMat("f",0.26,0.24,0.23),     // 카펫 타일
        matCeil=mkMat("c",0.50,0.49,0.47),      // 천장 텍스
        matStair=mkMat("s",0.36,0.34,0.32),
        matRubble=mkMat("r",0.17,0.15,0.14),
        matGround=mkMat("g",0.13,0.14,0.12),
        matDesk=mkMat("dk",0.42,0.32,0.22),     // 목재 상판
        matMetal=mkMat("mt",0.30,0.31,0.33),
        matPanel=mkMat("pn",0.28,0.34,0.36),    // 파티션 패브릭
        matScreen=mkMat("sc",0.05,0.06,0.08,new BABYLON.Color3(0.02,0.03,0.05)),
        matDoor=mkMat("d",0.44,0.30,0.18),
        matDoorLocked=mkMat("dl",0.30,0.10,0.09),
        matLampOff=mkMat("lo",0.35,0.35,0.34),
        matLampOn=mkMat("ln",0.9,0.9,0.85,new BABYLON.Color3(0.55,0.55,0.5));

  const shadowCasters=[];
  function makeWall(x,y,z,w,h,d,mat){
    const b=BABYLON.MeshBuilder.CreateBox("wall",{width:w,height:h,depth:d},scene);
    b.position.set(x,y,z);b.material=mat||matWall;b.checkCollisions=true;b.receiveShadows=true;
    if(shadowCasters.length<60)shadowCasters.push(b);
    return b;
  }
  function makeSlab(x,y,z,w,d,mat){
    const f=BABYLON.MeshBuilder.CreateBox("floor",{width:w,height:0.3,depth:d},scene);
    f.position.set(x,y-0.15,z);f.material=mat||matFloor;
    f.isWalkable=true;f.checkCollisions=false;f.receiveShadows=true;return f;
  }
  function makeFloorWithHole(y,x1,x2,z1,z2,hx1,hx2,hz1,hz2,mat){
    if(hx1>x1)makeSlab((x1+hx1)/2,y,(z1+z2)/2,hx1-x1,z2-z1,mat);
    if(x2>hx2)makeSlab((hx2+x2)/2,y,(z1+z2)/2,x2-hx2,z2-z1,mat);
    if(hz1>z1)makeSlab((hx1+hx2)/2,y,(z1+hz1)/2,hx2-hx1,hz1-z1,mat);
    if(z2>hz2)makeSlab((hx1+hx2)/2,y,(hz2+z2)/2,hx2-hx1,z2-hz2,mat);
  }
  function wallLineX(x,yB,h,z1,z2,gaps,mat){
    let cur=z1;for(const [a,b] of gaps){if(a>cur)makeWall(x,yB+h/2,(cur+a)/2,0.35,h,a-cur,mat);cur=Math.max(cur,b);}
    if(cur<z2)makeWall(x,yB+h/2,(cur+z2)/2,0.35,h,z2-cur,mat);
  }
  function wallLineZ(z,yB,h,x1,x2,gaps,mat){
    let cur=x1;for(const [a,b] of gaps){if(a>cur)makeWall((cur+a)/2,yB+h/2,z,a-cur,h,0.35,mat);cur=Math.max(cur,b);}
    if(cur<x2)makeWall((cur+x2)/2,yB+h/2,z,x2-cur,h,0.35,mat);
  }
  function makeStairs(cx,baseY,startZ,steps,stepW,stepH,stepD,dir,mat){
    const runLen=steps*stepD,rise=steps*stepH;
    const ramp=BABYLON.MeshBuilder.CreateBox("ramp",{width:stepW,height:0.35,depth:Math.hypot(runLen,rise)+1.0},scene);
    ramp.position.set(cx,baseY+rise/2,startZ+dir*(runLen/2-stepD/2));
    ramp.rotation.x=-dir*Math.atan2(rise,runLen);
    ramp.material=mat||matStair;ramp.isWalkable=true;ramp.checkCollisions=false;
    ramp.receiveShadows=true;ramp.isStairs=true;
    for(let i=0;i<steps;i++){
      const h=(i+1)*stepH;
      const s=BABYLON.MeshBuilder.CreateBox("tread",{width:stepW,height:h,depth:stepD*0.9},scene);
      s.position.set(cx,baseY+h/2,startZ+dir*(i*stepD));
      s.material=mat||matStair;s.checkCollisions=false;s.receiveShadows=true;s.isPickable=false;
    }
    makeWall(cx-stepW/2-0.2,baseY+rise/2+0.6,startZ+dir*(runLen/2),0.35,rise+2.0,runLen+0.8,mat);
    makeWall(cx+stepW/2+0.2,baseY+rise/2+0.6,startZ+dir*(runLen/2),0.35,rise+2.0,runLen+0.8,mat);
    return baseY+rise;
  }

  /* ═══ 지면 · 외벽 ═══ */
  makeSlab(0,0,0,260,300,matGround);
  makeWall(-BX,H3/2,0,0.6,H3,BZ*2);makeWall(BX,H3/2,0,0.6,H3,BZ*2);
  makeWall(0,H3/2,-BZ,BX*2,H3,0.6);
  makeWall(-24.5,H3/2,BZ,41,H3,0.6);makeWall(24.5,H3/2,BZ,41,H3,0.6);
  makeWall(0,(3.4+H3)/2,BZ,8,H3-3.4,0.6);
  makeSlab(0,0.02,BZ+5,10,10,matStair);

  makeStairs(35,0,52,20,5.0,FH/20,0.7,-1);      // 1→2층 (방 2,3)
  makeStairs(-35,FH,-52,20,5.0,FH/20,0.7,1);    // 2→3층 (방 0,0)
  makeFloorWithHole(FH,-BX,BX,-BZ,BZ, 31,39, 35,54, matFloor);
  makeFloorWithHole(FH*2,-BX,BX,-BZ,BZ, -39,-31, -54,-35, matFloor);
  const ceilTop=BABYLON.MeshBuilder.CreateBox("ct",{width:BX*2,height:0.3,depth:BZ*2},scene);
  ceilTop.position.set(0,H3,0);ceilTop.material=matCeil;
  makeWall(35,FH+1.0,54.4,7.6,2.0,0.35);makeWall(30.6,FH+1.0,45,0.35,2.0,19);
  makeWall(-35,FH*2+1.0,-54.4,7.6,2.0,0.35);makeWall(-30.6,FH*2+1.0,-45,0.35,2.0,19);

  /* ═══ 문 시스템 ═══ */
  const doors=[];
  const DW=4.0, DH=3.3;
  function makeDoor(axis,konst,center,yB,unlocked){
    const hinge=new BABYLON.TransformNode("hinge",scene);
    const d=BABYLON.MeshBuilder.CreateBox("door",
      axis==='X'?{width:0.16,height:DH,depth:DW}:{width:DW,height:DH,depth:0.16},scene);
    d.material=matDoor;d.checkCollisions=true;d.receiveShadows=true;d.isPickable=false;
    if(axis==='X'){ hinge.position.set(konst,yB,center-DW/2); d.parent=hinge; d.position.set(0,DH/2,DW/2); }
    else          { hinge.position.set(center-DW/2,yB,konst); d.parent=hinge; d.position.set(DW/2,DH/2,0); }
    // 문틀
    const frameMat=matMetal;
    if(axis==='X'){ makeWall(konst,yB+DH+0.35,center,0.4,FH-DH-0.7,DW,frameMat); }
    else          { makeWall(center,yB+DH+0.35,konst,DW,FH-DH-0.7,0.4,frameMat); }
    const door={mesh:d,hinge,unlocked,open:false,tried:false,busy:false,
                pos:new BABYLON.Vector3(axis==='X'?konst:center, yB+1.2, axis==='X'?center:konst)};
    doors.push(door);return door;
  }
  function openDoor(dr){
    dr.busy=true;dr.open=true;doorCreak();
    const t0=performance.now(),DUR=800,dir=(Math.random()<0.5?-1:1);
    const anim=()=>{
      const t=Math.min((performance.now()-t0)/DUR,1);
      dr.hinge.rotation.y=dir*(Math.PI/2)*(1-Math.pow(1-t,3));
      if(t<1)requestAnimationFrame(anim);
      else{dr.busy=false;dr.mesh.checkCollisions=false;}
    };anim();
  }
  function rattleDoor(dr){
    dr.busy=true;doorLocked();
    if(!dr.tried){dr.tried=true;dr.mesh.material=matDoorLocked;}
    const t0=performance.now(),DUR=420;
    const anim=()=>{
      const t=(performance.now()-t0)/DUR;
      if(t<1){dr.hinge.rotation.y=Math.sin(t*Math.PI*7)*0.045*(1-t);requestAnimationFrame(anim);}
      else{dr.hinge.rotation.y=0;dr.busy=false;}
    };anim();
  }

  /* ═══ 층 구성: 3열 × 4행 = 12개 사무 구역 ═══ */
  const rowZ=[[-60,-30],[-30,0],[0,30],[30,60]], rowC=[-45,-15,15,45];
  const colX=[[-45,-15],[-15,15],[15,45]],       colC=[-30,0,30];

  function buildFloor(yB,unlocked){
    [-15,15].forEach(X=>{
      for(let j=0;j<4;j++){
        const zc=rowC[j];
        wallLineX(X,yB,FH,rowZ[j][0],rowZ[j][1],[[zc-DW/2,zc+DW/2]]);
        makeDoor('X',X,zc,yB,unlocked.has(`X${X}r${j}`));
      }
    });
    [-30,0,30].forEach(Z=>{
      for(let i=0;i<3;i++){
        const xc=colC[i];
        wallLineZ(Z,yB,FH,colX[i][0],colX[i][1],[[xc-DW/2,xc+DW/2]]);
        makeDoor('Z',Z,xc,yB,unlocked.has(`Z${Z}c${i}`));
      }
    });
  }
  // 정답 경로의 문만 열린다
  buildFloor(0,    new Set(["X-15r3","Z30c0","X-15r2","Z0c1","X15r1","Z0c2","Z30c2"]));
  buildFloor(FH,   new Set(["Z30c2","X15r2","Z0c1","X-15r1","Z-30c0"]));
  buildFloor(FH*2, new Set(["X-15r0","Z-30c1","X15r1","Z0c2","Z30c2"]));

  /* ═══ 사무실 집기 (인스턴싱으로 가볍게) ═══ */
  const deskProto=BABYLON.MeshBuilder.CreateBox("deskP",{width:2.2,height:0.09,depth:1.1},scene);
  deskProto.material=matDesk;deskProto.isPickable=false;deskProto.setEnabled(false);
  const legProto=BABYLON.MeshBuilder.CreateBox("legP",{width:2.0,height:0.72,depth:0.9},scene);
  legProto.material=matMetal;legProto.isPickable=false;legProto.setEnabled(false);
  const panelProto=BABYLON.MeshBuilder.CreateBox("panP",{width:2.4,height:1.35,depth:0.09},scene);
  panelProto.material=matPanel;panelProto.isPickable=false;panelProto.setEnabled(false);
  const chairProto=BABYLON.MeshBuilder.CreateBox("chP",{width:0.55,height:0.95,depth:0.55},scene);
  chairProto.material=matMetal;chairProto.isPickable=false;chairProto.setEnabled(false);
  const monProto=BABYLON.MeshBuilder.CreateBox("mnP",{width:0.62,height:0.4,depth:0.06},scene);
  monProto.material=matScreen;monProto.isPickable=false;monProto.setEnabled(false);
  const cabProto=BABYLON.MeshBuilder.CreateBox("cbP",{width:1.0,height:1.6,depth:0.55},scene);
  cabProto.material=matMetal;cabProto.isPickable=false;cabProto.setEnabled(false);
  const lampProto=BABYLON.MeshBuilder.CreateBox("lpP",{width:2.4,height:0.08,depth:0.5},scene);
  lampProto.material=matLampOff;lampProto.isPickable=false;lampProto.setEnabled(false);

  let instCount=0;

    {at:155,run(){shakeUntil=performance.now()+1500;dmgInteg(13);rumble();dropRubble(18,FH*2+1.1,25,6,2.2,5);makeFire(14,FH*2+0.2,22,1.1,false);showMessage("3층에 불길이 번졌다!");}},
    {at:105,run(){shakeUntil=performance.now()+1600;dmgInteg(14);rumble();dropRubble(-30,FH*2+1.1,5,6,2.2,5);showMessage("3층 천장이 내려앉는다!");}},
    {at:60,run(){shakeUntil=performance.now()+1900;dmgInteg(16);rumble();scene.fogColor=new BABYLON.Color3(0.28,0.13,0.08);showMessage("건물 전체가 흔들린다!");}},
    {at:20,run(){shakeUntil=performance.now()+2600;dmgInteg(15);rumble();showMessage("나가! 지금 당장!");}}
  ];

  /* ═══ 생존자 동행 ═══ */
  const F_MIN=2.4,F_MAX=22,SV_SPEED=4.1;
  scene.onBeforeRenderObservable.add(()=>{
    if(!GAME.survivorFollowing||GAME.over||GAME.phase>=2.5)return;
    const dt=engine.getDeltaTime()/1000;
    const to=camera.position.subtract(survivor.position);to.y=0;
    const dist=to.length();
    if(dist>F_MIN){
      to.normalize();
      const nx=survivor.position.add(to.scale(SV_SPEED*dt));
      const h=scene.pickWithRay(new BABYLON.Ray(new BABYLON.Vector3(nx.x,survivor.position.y+1.5,nx.z),DOWN,28),pred);
      if(h&&h.hit){
        survivor.position.x=nx.x;survivor.position.z=nx.z;
        survivor.position.y+=(h.pickedPoint.y+0.85-survivor.position.y)*0.25;
      }
      survivor.rotation.y=Math.atan2(to.x,to.z);
    }
    if(dist>F_MAX)showMessage("생존자가 뒤처졌다!",900);
  });

  /* ═══ E 상호작용: 문 / 생존자 ═══ */
  addEventListener("keydown",e=>{
    if(e.code!=="KeyE"||GAME.over||GAME.phase===2.5)return;
    const dSv=BABYLON.Vector3.Distance(camera.position,survivor.position);
    if(!GAME.survivorFound&&dSv<3.6){
      GAME.survivorFound=true;GAME.survivorFollowing=true;GAME.phase=2;
      svMat.emissiveColor=new BABYLON.Color3(0.15,0.3,0.5);
      showMessage("생존자를 발견했다. 함께 1층 정문으로!",4000);
      objEl.innerText="목표: 생존자를 데리고 1층 정문으로 내려가라";return;
    }
    if(nearDoor&&!nearDoor.busy&&!nearDoor.open){
      if(nearDoor.unlocked){openDoor(nearDoor);}
      else{rattleDoor(nearDoor);showMessage("잠겨 있다. 다른 길을 찾자.",1400);}
    }
  });
  scene.onPointerDown=(evt,pick)=>{if(pick.hit&&pick.pickedMesh===survivor&&!GAME.survivorFound){
    if(BABYLON.Vector3.Distance(camera.position,survivor.position)<3.6){
      GAME.survivorFound=true;GAME.survivorFollowing=true;GAME.phase=2;
      svMat.emissiveColor=new BABYLON.Color3(0.15,0.3,0.5);
      showMessage("생존자를 발견했다. 함께 1층 정문으로!",4000);
      objEl.innerText="목표: 생존자를 데리고 1층 정문으로 내려가라";
    }}};

  /* ═══ 컷신 ═══ */
  let arsonTarget=null;
  function playCutscene(){
    GAME.phase=2.5;GAME.cutscenePlayed=true;
    scream();showMessage("생존자: \"으아악—!\"",2200);
    setTimeout(()=>{
      fade.style.opacity=1;
      setTimeout(()=>{
        camera.position.set(0,1.7,BZ-16);camera.rotation.set(0,0,0);
        survivor.position.set(2.2,0.85,BZ-12);
        arsonist.setEnabled(true);arsonist.position.set(-1.0,0.95,BZ-6);
        exitBlock.setEnabled(true);
        setMask(false,true);fade.style.opacity=0;
        showMessage("정문이... 이미 잔해로 막혀 있다. 그리고 저 자는?",3400);
        setTimeout(()=>{
          showMessage("방화범: \"목격자는 남길 수 없지.\"",3000);
          arsonTarget=survivor.position.clone();rumble();
          setTimeout(()=>{
            survivor.rotation.z=Math.PI/2;survivor.position.y=0.35;
            svMat.diffuseColor=new BABYLON.Color3(0.35,0.1,0.1);
            svMat.emissiveColor=new BABYLON.Color3(0.08,0,0);
            scream();showMessage("생존자가 쓰러졌다...",2600);
            setTimeout(()=>{
              GAME.phase=3;GAME.chasing=true;arsonTarget=null;
              objEl.innerText="페이즈 3: 방화범에게 쫓긴다 — 위층으로 도망쳐라";
              showMessage("다음은 너다. 도망쳐!",3200);
              fires.forEach(f=>{f.ps.emitRate=80;f.smoke.emitRate=40;});
            },2600);
          },3000);
        },3400);
      },700);
    },2200);
  }
  scene.onBeforeRenderObservable.add(()=>{
    if(GAME.over||GAME.cutscenePlayed||!GAME.survivorFollowing)return;
    const p=camera.position;
    if(p.z>BZ-20&&Math.abs(p.x)<14&&p.y<FH-1&&
       BABYLON.Vector3.Distance(p,survivor.position)<12) playCutscene();
  });
  scene.onBeforeRenderObservable.add(()=>{
    if(GAME.over)return;
    const dt=engine.getDeltaTime()/1000;
    if(arsonTarget){
      const to=arsonTarget.subtract(arsonist.position);to.y=0;
      if(to.length()>1.2){to.normalize();arsonist.position.addInPlace(to.scale(2.6*dt));}
      arsonist.rotation.y=Math.atan2(to.x,to.z);return;
    }
    if(GAME.chasing){
      const to=camera.position.subtract(arsonist.position);to.y=0;
      const dist=to.length();
      if(dist>1.0){
        to.normalize();
        const nx=arsonist.position.add(to.scale(4.6*dt));
        const h=scene.pickWithRay(new BABYLON.Ray(new BABYLON.Vector3(nx.x,arsonist.position.y+1.6,nx.z),DOWN,30),pred);
        if(h&&h.hit){arsonist.position.x=nx.x;arsonist.position.z=nx.z;
          arsonist.position.y+=(h.pickedPoint.y+0.95-arsonist.position.y)*0.2;}
        arsonist.rotation.y=Math.atan2(to.x,to.z);
      }
      if(dist<1.6)endGame("사망","방화범에게 붙잡혔다.");
    }
  });

  /* ═══ 타이머 ═══ */
  const tick=setInterval(()=>{
    if(GAME.over){clearInterval(tick);return;}
    if(GAME.phase===2.5)return;
    GAME.timeLeft--;
    timerEl.innerText=`${String(Math.floor(GAME.timeLeft/60)).padStart(2,"0")}:${String(GAME.timeLeft%60).padStart(2,"0")}`;
    timerEl.style.color=GAME.timeLeft<=60?"#ff5b4a":"#fff";
    collapseEvents.forEach(ev=>{if(!ev.done&&GAME.timeLeft===ev.at){ev.done=true;ev.run();}});
    if(GAME.timeLeft<=0)endGame("붕괴","건물이 완전히 무너졌다.");
  },1000);

  setMask(true,true);refreshTorch();
  return scene;
};
const scene=createScene();
engine.runRenderLoop(()=>scene.render());
addEventListener("resize",()=>engine.resize());
</script>
</body>
